<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030712" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f7" />
    <script>
      // Apply the saved theme before React mounts to avoid a flash (dark default).
      (function () {
        try {
          var stored = localStorage.getItem('anvation-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : 'dark'; // fresh visitors always open in dark; toggle persists otherwise
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>Anvation - National 24-Hour Hackathon | explore, innovate, transform</title>
    <meta name="description" content="Anvation: explore, innovate, transform — National 24-Hour Hackathon at KSSEM Bengaluru on October 8–9, 2026. ₹50,000 Total Prize Pool." />
    <meta property="og:title" content="Anvation - National 24-Hour Hackathon | explore, innovate, transform" />
    <meta property="og:description" content="Anvation: explore, innovate, transform — National 24-Hour Hackathon at KSSEM Bengaluru on October 8–9, 2026. ₹50,000 Total Prize Pool." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
